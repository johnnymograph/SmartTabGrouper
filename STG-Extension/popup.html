<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Tab Grouper</title>
  <style>
    body { 
      width: 290px; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding: 14px; 
      margin: 0; 
      background: #fdfdfd; 
      color: #2d3748; 
    }
    
    h2 { 
      font-size: 15px; 
      margin: 0 0 12px 0; 
      color: #1a202c; 
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-primary { 
      width: 100%; 
      background: #2563eb; 
      color: white; 
      border: none; 
      padding: 10px; 
      border-radius: 8px; 
      font-weight: 600; 
      font-size: 13px;
      cursor: pointer; 
      transition: background 0.2s, transform 0.1s; 
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
      margin-bottom: 10px;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:active { transform: scale(0.98); }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .btn-icon {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #e2e8f0;
      padding: 7px 4px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s, color 0.2s;
    }
    .btn-icon:hover { background: #e2e8f0; color: #1e293b; }
    .btn-danger { color: #dc2626; border-color: #fecaca; background: #fef2f2; }
    .btn-danger:hover { background: #fee2e2; }

    .stats-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #64748b;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 5px 8px;
      margin-bottom: 10px;
      font-variant-numeric: tabular-nums;
    }
    .stats-bar strong {
      color: #1e293b;
      font-weight: 600;
    }

    details {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
    }
    summary {
      font-weight: 500;
      color: #475569;
      cursor: pointer;
      user-select: none;
      outline: none;
    }
    summary:hover { color: #1e293b; }

    .settings-body {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #e2e8f0;
    }

    .option { margin-bottom: 8px; display: flex; align-items: center; gap: 8px; cursor: pointer; color: #475569; }
    .slider-container, .input-container { margin-bottom: 10px; }
    .slider-container label { display: flex; justify-content: space-between; margin-bottom: 3px; font-weight: 500; color: #475569; }
    
    input[type="range"] { width: 100%; cursor: pointer; accent-color: #2563eb; }
    input[type="text"] { width: 100%; padding: 6px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 11px; outline: none; }
    input[type="text"]:focus { border-color: #2563eb; }

    .shortcut-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #e2e8f0;
      font-size: 11px;
      color: #475569;
    }
    .shortcut-tag {
      background: #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-weight: 600;
      color: #1e293b;
    }
    .btn-link {
      background: none;
      border: none;
      color: #2563eb;
      cursor: pointer;
      font-size: 11px;
      text-decoration: underline;
      padding: 0;
    }

    .ram-tip {
      margin-top: 10px;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
    }
    .ram-tip kbd {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 3px;
      padding: 1px 4px;
      font-family: monospace;
      font-size: 10px;
      color: #475569;
    }
  </style>
</head>
<body>
  <h2>Smart Tab Grouper ⚡</h2>
  
  <button id="organizeBtn" class="btn-primary">Organize Tabs</button>

  <div class="toolbar">
    <button id="sortAlphabeticallyBtn" class="btn-icon" title="Sort groups A-Z">🔤 Sort</button>
    <button id="collapseGroupsBtn" class="btn-icon" title="Minimize all groups">📁 Collapse</button>
    <button id="ungroupAllBtn" class="btn-icon btn-danger" title="Ungroup all tabs">🔓 Ungroup</button>
  </div>

  <div class="stats-bar" id="statsBar">
    <span><strong id="totalTabsCount">0</strong> tabs</span>
    <span>·</span>
    <span><strong id="ungroupedTabsCount">0</strong> ungrouped</span>
    <span>·</span>
    <span><strong id="groupsCount">0</strong> groups</span>
  </div>

  <details>
    <summary>⚙️ Advanced settings</summary>
    <div class="settings-body">
      <label class="option">
        <input type="checkbox" id="includeGrouped"> Include already grouped tabs
      </label>

      <div class="slider-container">
        <label for="thresholdRange">
          <span>Sensitivity:</span>
          <span id="thresholdLabel" style="font-weight: 600; color: #2563eb;">Flexible</span>
        </label>
        <input type="range" id="thresholdRange" min="0.10" max="0.50" step="0.02" value="0.12">
      </div>

      <div class="slider-container">
        <label for="minTabsRange">
          <span>Min. tabs per group:</span>
          <span id="minTabsVal" style="font-weight: 600; color: #2563eb;">2</span>
        </label>
        <input type="range" id="minTabsRange" min="2" max="4" step="1" value="2">
      </div>

      <div class="input-container">
        <label for="customGroupsInput" style="display:block; margin-bottom:3px; font-weight:500;">Forced groups (comma separated):</label>
        <input type="text" id="customGroupsInput" placeholder="ai, minimalism, blender">
      </div>

      <div class="shortcut-box">
        <span>Shortcut: <span id="shortcutDisplay" class="shortcut-tag">Unassigned</span></span>
        <button id="configureShortcutBtn" class="btn-link">Change / Disable</button>
      </div>
    </div>
  </details>

  <div class="ram-tip" title="Open Chrome's native Task Manager to check RAM usage per tab">
    💡 RAM usage: press <kbd>Shift</kbd> + <kbd>Esc</kbd>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
